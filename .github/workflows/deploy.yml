name: Deploy Worker
on:
  push:
    branches: [main]
    # public/** matters: those files ship with the Worker as static assets, so a change
    # to robots.txt / the manifest / icons is a deploy. Leaving it out meant such a change
    # committed cleanly and then silently never went live.
    paths: ["src/**", "public/**", "wrangler.toml", ".github/workflows/deploy.yml"]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

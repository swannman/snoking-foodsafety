name: Refresh inspection data
on:
  schedule:
    - cron: "0 17 * * 1"           # Mondays 17:00 UTC (10am PDT / 9am PST) — full King + Snohomish refresh
    - cron: "0 17 * * 0,2,3,4,5,6" # other days 17:00 UTC — fast King-only refresh (skips the slow Snohomish crawl)
  workflow_dispatch:
    inputs:
      king_only:
        description: "King County only (fast — skips the slow Snohomish crawl)"
        type: boolean
        default: false

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # persist the Census geocode + Snohomish program caches between runs so the
      # crawl/geocoding doesn't start cold every time
      - name: Restore caches
        uses: actions/cache@v4
        with:
          path: |
            ingest/geocache.json
            ingest/programs.json
          key: ingest-caches-${{ github.run_id }}
          restore-keys: ingest-caches-
      - name: Run ingester
        working-directory: ingest
        env:
          WORKER_URL: https://snoking-foodsafety.3lemenopy.workers.dev
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          GOOGLE_KEY: ${{ secrets.GOOGLE_KEY }}
        # --king-only when manually requested, or on any scheduled day except the Monday full run
        run: node ingest.mjs ${{ ((github.event_name == 'workflow_dispatch' && inputs.king_only) || github.event.schedule == '0 17 * * 0,2,3,4,5,6') && '--king-only' || '' }}
      # push a notification to anyone who favorited a restaurant whose rating just changed
      - name: Dispatch favorite-change notifications
        if: success()
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          curl -fsS -X POST "https://snoking-foodsafety.3lemenopy.workers.dev/push/dispatch" \
            -H "Authorization: Bearer $INGEST_TOKEN" && echo " (dispatch ok)" || echo " (dispatch failed, non-fatal)"
      # notify Bing/Yandex of the refreshed pages via IndexNow (key file is served from public/)
      - name: IndexNow ping
        if: success()
        working-directory: ingest
        run: node indexnow-submit.mjs || echo " (indexnow failed, non-fatal)"

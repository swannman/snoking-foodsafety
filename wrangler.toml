name = "snoking-foodsafety"
main = "src/index.js"
compatibility_date = "2024-11-01"
account_id = "e586791371224fd8a71725fce7f6f1a6"
workers_dev = true

# custom domains (zone must be active on this Cloudflare account)
[[routes]]
pattern = "food.snoking.live"
custom_domain = true

[[routes]]
pattern = "food.snoking.app"
custom_domain = true

# static files (icons, manifest, service worker) served straight from Cloudflare's edge —
# these requests never invoke the Worker, so they don't count against the request quota.
# The Worker still runs for any path with no matching asset (HTML pages + /api/*).
[assets]
directory = "./public"

[observability]
enabled = true

# per-deploy version id, so the client can detect a new build and auto-reload (no force-quit needed)
[version_metadata]
binding = "CF_VERSION_METADATA"

# Web Push: public VAPID key (safe to commit) + contact subject. Private key is the
# VAPID_PRIVATE_JWK secret (wrangler secret put). The same public key is embedded client-side.
[vars]
VAPID_PUBLIC = "BLUPpCG20smyXKX1k3fCvNd-7VyRHWjpIriPjy56_yc2-GotKcWD750ID015AQa4yYwdZSjBeq-LRBl3eEz0F9I"
VAPID_SUBJECT = "mailto:alerts@snoking.app"

[[d1_databases]]
binding = "DB"
database_name = "snoking-foodsafety"
database_id = "5c5ffdec-a164-4c51-862e-86b61171a9a2"

[[kv_namespaces]]
binding = "REGIONS"
id = "32eb27b3de934723a82c747e0b5d4dd7"

# anonymous product-usage events (which views/filters/features people use) — no PII
[[analytics_engine_datasets]]
binding = "AE"
dataset = "snoking_events"
